name: Build and publish Windows release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, test, package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $previous = git show HEAD^:VERSION 2>$null
          if ($LASTEXITCODE -eq 0 -and ($previous -join "").Trim() -eq $version) {
            $parts = $version.Split('.')
            $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          }
          ./publish-release.ps1 -Version $version
